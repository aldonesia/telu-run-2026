# ============================================
# Docker Compose untuk Tel-U Run 2026
# ============================================

version: '3.8'

services:
  tel-u-run:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tel-u-run-2026
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tel-u-run-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: tel-u-run-tunnel
    command: tunnel --no-autoupdate run --token eyJhIjoiMDc5MDNkOWM1MGQyYzcxMTkzZjA0NzIzMmViY2Y4ZDUiLCJ0IjoiMzdiNWM5MGItZDA1MC00YzAyLWE2ZWUtM2ZjOTZiNWM0NjM1IiwicyI6Ik5XRmhOMlV3TTJRdE9XUTVaQzAwWXpKbUxXRXlNVE10TnpreU5EUXdPRGMzT1dFMyJ9
    restart: unless-stopped
    depends_on:
      - tel-u-run
    networks:
      - tel-u-run-network

networks:
  tel-u-run-network:
    driver: bridge