# ============================================
# Docker Compose untuk Tel-U Run 2026
# ============================================

version: '3.8'

services:
  tel-u-run:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tel-u-run-2026
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tel-u-run-network

networks:
  tel-u-run-network:
    driver: bridge